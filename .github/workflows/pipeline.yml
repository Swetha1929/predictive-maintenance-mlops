name: Week 3 MLS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r week_3_mls/requirements.txt

      - name: Register Dataset
        run: python week_3_mls/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: week_3_mls/data/machine-failure-prediction.csv

  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r week_3_mls/requirements.txt

      - name: Prepare Data
        run: python week_3_mls/model_building/prep.py

      - name: Upload Train/Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r week_3_mls/requirements.txt

      - name: Download Train/Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Train Model
        run: python week_3_mls/model_building/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add week_3_mls/deployment/best_machine_failure_model_v1.joblib

          git diff --cached --quiet || git commit -m "Add trained model [skip ci]"

          git push
          git push
